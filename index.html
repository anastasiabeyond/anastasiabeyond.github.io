<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anastasia Beyond | Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #d8baff;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-top: 20px;
            padding-bottom: 40px;
            overflow-x: hidden;
            position: relative;

            /* FONDO DEGRADADO */
            background: #000000;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(30, 10, 40, 0.7) 0%, rgba(0, 0, 0, 1) 100%),
                url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAIklEQVQIW2NkQAKrVq36z8gAFWNgAInAzMAAVMDIABVjYAAA7gYFAm7v0X0AAAAASUVORTH5CYII=');
            background-size: cover, auto;
            background-repeat: no-repeat, repeat;
        }

        /* EFECTO DE ESTRELLAS/LUCES EN EL FONDO */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 2px;
            height: 2px;
            background: transparent;
            box-shadow: 
                2vw 15vh #fff, 5vw 85vh 1px #fff, 10vw 35vh #fff,
                15vw 60vh 2px #fff, 20vw 20vh #fff, 25vw 90vh 1px #fff,
                30vw 40vh #fff, 35vw 75vh 2px #fff, 40vw 15vh 1px #fff,
                45vw 50vh #fff, 8vw 95vh 2px #fff, 18vw 10vh 1px #fff,
                28vw 65vh #fff, 38vw 30vh 2px #fff, 48vw 80vh 1px #fff,
                52vw 85vh #fff, 58vw 20vh 1px #fff, 62vw 65vh #fff,
                68vw 10vh 2px #fff, 75vw 90vh #fff, 80vw 35vh 1px #fff,
                85vw 70vh #fff, 90vw 15vh 2px #fff, 95vw 80vh 1px #fff,
                55vw 45vh #fff, 70vw 25vh 1px #fff, 88vw 50vh 2px #fff;
            animation: animateStars 20s linear infinite;
            opacity: 0.85;
            z-index: 0;
        }

        .stars::after {
            content: " ";
            position: absolute;
            top: 500px;
            width: 2px;
            height: 2px;
            background: transparent;
            box-shadow: inherit;
        }

        @keyframes animateStars {
            from { transform: translateY(0px); }
            to { transform: translateY(-500px); }
        }

        /* LUCES PÚRPURAS/DORADAS DE FONDO */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        .glow-purple-1 {
            background: radial-gradient(circle, rgba(138, 43, 226, 0.4) 0%, rgba(138, 43, 226, 0) 70%);
            top: 30%;
            left: 10%;
        }
        .glow-purple-2 {
            background: radial-gradient(circle, rgba(138, 43, 226, 0.3) 0%, rgba(138, 43, 226, 0) 70%);
            bottom: 10%;
            right: 20%;
        }
        .glow-gold-1 {
            background: radial-gradient(circle, rgba(255, 215, 0, 0.2) 0%, rgba(255, 215, 0, 0) 70%);
            top: 60%;
            right: 15%;
        }

        .container {
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 2;
        }

        .page-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 0;
            letter-spacing: -0.5px;
            text-align: center;
            width: 100%;
            color: #d8baff;
            text-shadow: 0 0 10px rgba(138, 43, 226, 0.5);
        }

        .beam {
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, rgba(138, 43, 226, 0) 0%, rgba(138, 43, 226, 1) 50%, rgba(138, 43, 226, 0) 100%);
            margin-top: 15px;
            margin-bottom: 25px;
            box-shadow: 0 0 15px 3px rgba(138, 43, 226, 0.8);
        }

        .social-icons-row {
            display: flex;
            gap: 24px;
            margin: 0 0 25px 0;
            justify-content: center;
            width: 100%;
        }

        .icon-flat {
            font-size: 24px;
            color: #d8baff;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s, transform 0.2s;
            padding: 10px;
        }

        .icon-flat:active {
            transform: scale(0.9);
            opacity: 0.7;
        }

        .content-links {
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        .main-card {
            width: 100%;
            height: 380px;
            border-radius: 24px;
            position: relative;
            background-size: cover;
            background-position: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.7);
            border: 1px solid rgba(216, 186, 255, 0.2);
            overflow: visible;
        }

        .long-button {
            width: 100%;
            height: 56px;
            border-radius: 20px;
            background: #000000;
            display: flex;
            align-items: center;
            padding: 4px 6px;
            text-decoration: none;
            color: white;
            font-weight: 500;
            font-size: 15px;
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            border: 2px solid #8e5bd9;
            box-shadow: 
                0 0 25px rgba(255, 255, 255, 0.5),
                0 0 15px rgba(138, 43, 226, 0.7); 
        }

        .long-button:active {
            transform: scale(0.98);
            box-shadow: 
                0 0 15px rgba(255, 255, 255, 0.3),
                0 0 8px rgba(138, 43, 226, 0.5);
            border-color: #d8baff;
        }

        .btn-icon-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .btn-ic-links { background: #000000; font-size: 20px; }

        .btn-label {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* --- AVISO COMPACTO DENTRO DEL BOTÓN MY LINKS --- */
        .btn-promo-badge-mini {
            position: absolute;
            right: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: rotate(3deg);
            animation: pulseGlowMini 2.5s infinite alternate;
            pointer-events: none;
        }

        .btn-badge-box {
            background: rgba(10, 5, 18, 0.9);
            backdrop-filter: blur(5px);
            border: 1.5px solid #ffffff;
            box-shadow: 
                0 0 10px rgba(255, 255, 255, 0.7),
                0 0 15px rgba(138, 43, 226, 0.8);
            border-radius: 10px;
            padding: 2px 8px;
            text-align: center;
        }

        .btn-promo-tag {
            color: #d8baff;
            font-size: 7.5px;
            font-weight: 800;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            line-height: 1;
        }

        .btn-promo-percent {
            color: #ffffff;
            font-size: 13px;
            font-weight: 900;
            line-height: 1;
            text-shadow: 0 0 8px rgba(138, 43, 226, 0.9);
        }

        .btn-badge-sub {
            background: linear-gradient(90deg, #8e5bd9 0%, #ffffff 50%, #8e5bd9 100%);
            color: #000000;
            font-weight: 900;
            font-size: 7.5px;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            padding: 1.5px 6px;
            border-radius: 10px;
            margin-top: 2px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
            white-space: nowrap;
            border: 0.5px solid #ffffff;
        }

        @keyframes pulseGlowMini {
            from {
                transform: rotate(3deg) scale(1);
                filter: drop-shadow(0 0 5px rgba(138, 43, 226, 0.6));
            }
            to {
                transform: rotate(3deg) scale(1.05);
                filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.9));
            }
        }
    </style>
</head>
<body>

    <!-- CAPAS DE FONDO Y LUCES -->
    <div class="stars"></div>
    <div class="bg-glow glow-purple-1"></div>
    <div class="bg-glow glow-purple-2"></div>
    <div class="bg-glow glow-gold-1"></div>

    <div class="container">

        <h1 class="page-title">Anastasia Beyond</h1>
        <div class="beam"></div>

        <div class="social-icons-row">
            <a href="https://youtube.com/@AnastasiaBeyondTV" target="_blank" rel="noopener noreferrer" class="icon-flat"><i class="fa-brands fa-youtube"></i></a>
            <a href="https://instagram.com/anastasiabeyond1" target="_blank" rel="noopener noreferrer" class="icon-flat"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://www.tiktok.com/@anastasiabeyond1" target="_blank" rel="noopener noreferrer" class="icon-flat"><i class="fa-brands fa-tiktok"></i></a>
            <a href="https://x.com/anastasiabey1" target="_blank" rel="noopener noreferrer" class="icon-flat"><i class="fa-brands fa-x-twitter"></i></a>
        </div>

        <div class="content-links">
            
            <!-- Imagen Principal de la Portada -->
            <div class="main-card" style="background-image: url('anastasia_main.jpeg');"></div>

            <!-- Botón My Links CON AVISO ADAPTADO Y LLAMATIVO -->
            <a href="aboutme.html" class="long-button">
                <div class="btn-icon-circle btn-ic-links"><i class="fa-solid fa-link"></i></div>
                <span class="btn-label">My Links</span>

                <!-- INSIGNIA MINI PROMO LABOR DAY -->
                <div class="btn-promo-badge-mini">
                    <div class="btn-badge-box">
                        <div class="btn-promo-tag">Labor Day</div>
                        <div class="btn-promo-percent">30% OFF</div>
                    </div>
                    <div class="btn-badge-sub">Fri, Sept 4th</div>
                </div>
            </a>

        </div>

    </div>

</body>
</html>
