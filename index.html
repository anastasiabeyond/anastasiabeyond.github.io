<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anastasia Beyond | Página Principal</title>
    <style>
        /* RESET BÁSICO */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden; /* Para que el efecto de partículas no cree barras de desplazamiento */
            position: relative; /* Base para el posicionamiento de fondo */

            /* NUEVO FONDO: Degradado oscuro con textura, basado en la foto */
            background: #000000; /* Fondo base negro */
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(30, 10, 40, 0.7) 0%, rgba(0, 0, 0, 1) 100%), /* Degradado púrpura central sutil */
                url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAIklEQVQIW2NkQAKrVq36z8gAFWNgAInAzMAAVMDIABVjYAAA7gYFAm7v0X0AAAAASUVORK5CYII='); /* Patrón de textura de puntos muy sutil (reemplazable por imagen real) */
            background-size: cover, auto;
            background-repeat: no-repeat, repeat;
        }

        /* EFECTO DE ESTRELLAS/LUCES EN EL FONDO (PARTÍCULAS CSS) */
        .stars {
            position: absolute;
            width: 1px;
            height: 1px;
            background: transparent;
            box-shadow: 
                10vw 20vh #fff, 25vw 40vh 1px #fff, 70vw 60vh 2px #fff, 
                80vw 10vh #fff, 30vw 70vh 1px #fff, 90vw 90vh 2px #fff,
                15vw 15vh #fff, 45vw 25vh 1px #fff, 65vw 85vh 2px #fff,
                5vw 80vh #fff, 35vw 95vh 1px #fff, 55vw 55vh 2px #fff;
            animation: animateStars 100s linear infinite;
            opacity: 0.5; /* Sutil */
        }
        .stars::after {
            content: " ";
            position: absolute;
            top: 2000px;
            width: 1px;
            height: 1px;
            background: transparent;
            box-shadow: 
                10vw 20vh #fff, 25vw 40vh 1px #fff, 70vw 60vh 2px #fff, 
                80vw 10vh #fff, 30vw 70vh 1px #fff, 90vw 90vh 2px #fff,
                15vw 15vh #fff, 45vw 25vh 1px #fff, 65vw 85vh 2px #fff,
                5vw 80vh #fff, 35vw 95vh 1px #fff, 55vw 55vh 2px #fff;
        }

        @keyframes animateStars {
            from { transform: translateY(0px); }
            to { transform: translateY(-2000px); }
        }

        /* LUCES PÚRPURAS/DORADAS SUTILES (RESPLANDOR DE FONDO) */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
        }
        .glow-purple-1 {
            background: radial-gradient(circle, rgba(138, 43, 226, 0.4) 0%, rgba(138, 43, 226, 0) 70%);
            top: 60%;
            left: 20%;
        }
        .glow-purple-2 {
            background: radial-gradient(circle, rgba(138, 43, 226, 0.3) 0%, rgba(138, 43, 226, 0) 70%);
            bottom: 10%;
            right: 30%;
        }
        .glow-gold-1 {
            background: radial-gradient(circle, rgba(255, 215, 0, 0.2) 0%, rgba(255, 215, 0, 0) 70%);
            top: 75%;
            right: 15%;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            /* Flexbox se encargará de centrar todo el bloque verticalmente */
            position: relative; /* Para el rayo absoluto */
        }

        /* TÍTULO PRINCIPAL: Mantiene posición y estilo, pero con sombra de luz */
        .page-title {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 50px; 
            margin-top: -20px; 
            color: #d8baff; /* Color de letra púrpura muy claro, como en la foto */
            text-shadow: 0 0 10px rgba(138, 43, 226, 0.5); /* Sombra de luz púrpura sutil */
        }

        /* EFECTO DE RAYO / DESTELLO LUMINOSO DEBAJO DEL NOMBRE */
        .beam {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, rgba(138, 43, 226, 0) 0%, rgba(138, 43, 226, 1) 50%, rgba(138, 43, 226, 0) 100%);
            top: -25px; /* Justo debajo del título */
            left: 0;
            box-shadow: 0 0 15px 3px rgba(138, 43, 226, 0.8);
            z-index: 1; /* Por encima de la foto pero debajo del texto */
        }

        /* FOTO CENTRAL PRINCIPAL (MANTIENE DIMENSIONES Y CONTENIDO) */
        .header-banner {
            width: 100%;
            height: 380px; 
            background-image: url('anastasia_main.jpeg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 25px 20px;
            position: relative;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            margin-bottom: 50px; 
        }

        /* LEMA DENTRO DE LA FOTO EN LA PARTE INFERIOR */
        .profile-bio-inside {
            font-size: 16px;
            color: #ffffff;
            font-weight: 300;
            letter-spacing: 0.5px;
            text-shadow: 0px 1px 6px rgba(0,0,0,0.9);
            z-index: 2;
        }

        /* BOTÓN DE ENTRADA CON ILUMINACIÓN BLANCA INTENSA Y BORDE LUMINOSO, COMO EN LA FOTO */
        .main-entrance-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 85%;
            height: 58px;
            border-radius: 20px;
            background: #000000;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 17px;
            letter-spacing: 0.5px;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            margin-bottom: 20px; 
            border: 2px solid #8e5bd9; /* Borde púrpura/dorado sutil */
            
            /* MODIFICADO: Sombra de luz blanca/púrpura intensa y definida para equidistancia y estética */
            box-shadow: 
                0 0 25px rgba(255, 255, 255, 0.5), /* Resplandor blanco central */
                0 0 15px rgba(138, 43, 226, 0.7); /* Resplandor púrpura exterior */
        }

        .main-entrance-button:active {
            transform: scale(0.97);
            box-shadow: 
                0 0 15px rgba(255, 255, 255, 0.3),
                0 0 8px rgba(138, 43, 226, 0.5);
            border-color: #d8baff;
        }
    </style>
</head>
<body>

    <!-- Capas de fondo para efectos de luces -->
    <div class="stars"></div>
    <div class="bg-glow glow-purple-1"></div>
    <div class="bg-glow glow-purple-2"></div>
    <div class="bg-glow glow-gold-1"></div>

    <div class="container">
        
        <!-- Título principal -->
        <h1 class="page-title">Anastasia Beyond</h1>

        <!-- Rayo / Destello luminoso debajo del nombre -->
        <div class="beam"></div>

        <!-- Foto principal (MANTIENE DIMENSIONES Y CONTENIDO ORIGINAL) -->
        <div class="header-banner">
            <div class="profile-bio-inside">Beyond imagination</div>
        </div>

        <!-- Botón de acceso: Con iluminación intensa corregida -->
        <a href="aboutme.html" class="main-entrance-button">
            My Links
        </a>

    </div>

</body>
</html>
