<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anastasia Beyond | Official Site</title>
    <style>
        /* RESET BÁSICO */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;

            /* FONDO DEGRADADO OSCURO CON AMBIENTE PÚRPURA */
            background: #000000;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(40, 15, 55, 0.8) 0%, rgba(0, 0, 0, 1) 100%);
            background-size: cover;
            background-repeat: no-repeat;
        }

        /* ESTRELLAS Y LUCES FLOTANTES MÁS NOTORIAS */
        .stars {
            position: absolute;
            width: 2px;
            height: 2px;
            background: transparent;
            /* Luces más brillantes, con mayor radio de brillo */
            box-shadow: 
                10vw 20vh 2px #fff, 25vw 40vh 3px #fff, 70vw 60vh 2px #fff, 
                80vw 10vh 3px #fff, 30vw 70vh 2px #fff, 90vw 90vh 4px #fff,
                15vw 15vh 3px #fff, 45vw 25vh 2px #fff, 65vw 85vh 3px #fff,
                5vw 80vh 2px #fff, 35vw 95vh 3px #fff, 55vw 55vh 4px #fff,
                20vw 80vh 2px #e2b6ff, 75vw 30vh 3px #e2b6ff;
            animation: animateStars 70s linear infinite;
            opacity: 0.85; /* Incrementada la visibilidad para que resalten */
        }

        .stars::after {
            content: " ";
            position: absolute;
            top: 1000px;
            width: 2px;
            height: 2px;
            background: transparent;
            box-shadow: 
                10vw 20vh 2px #fff, 25vw 40vh 3px #fff, 70vw 60vh 2px #fff, 
                80vw 10vh 3px #fff, 30vw 70vh 2px #fff, 90vw 90vh 4px #fff,
                15vw 15vh 3px #fff, 45vw 25vh 2px #fff, 65vw 85vh 3px #fff,
                5vw 80vh 2px #fff, 35vw 95vh 3px #fff, 55vw 55vh 4px #fff,
                20vw 80vh 2px #e2b6ff, 75vw 30vh 3px #e2b6ff;
        }

        @keyframes animateStars {
            from { transform: translateY(0px); }
            to { transform: translateY(-1000px); }
        }

        /* RESPLANDORES PÚRPURAS DE FONDO */
        .bg-glow {
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        .glow-purple-1 {
            background: radial-gradient(circle, rgba(138, 43, 226, 0.45) 0%, rgba(138, 43, 226, 0) 70%);
            bottom: 15%;
            left: 15%;
        }
        .glow-purple-2 {
            background: radial-gradient(circle, rgba(160, 60, 255, 0.35) 0%, rgba(160, 60, 255, 0) 70%);
            bottom: 10%;
            right: 20%;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        /* TÍTULO PRINCIPAL */
        .page-title {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-top: -10px;
            margin-bottom: 0; /* Controlamos el espacio a través del rayo */
            color: #e2c8ff;
            text-shadow: 0 0 12px rgba(160, 60, 255, 0.7);
        }

        /* RAYO DE LUZ UBICADO JUSTO EN EL CENTRO ENTRE EL TÍTULO Y LA FOTO */
        .beam {
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, rgba(138, 43, 226, 0) 0%, rgba(186, 104, 200, 1) 50%, rgba(138, 43, 226, 0) 100%);
            margin-top: 18px; /* Distancia desde el título */
            margin-bottom: 25px; /* Distancia hacia la foto */
            box-shadow: 0 0 16px 3px rgba(186, 104, 200, 0.85);
        }

        /* FOTO CENTRAL PRINCIPAL */
        .header-banner {
            width: 100%;
            height: 380px; 
            background-image: url('anastasia_main.jpeg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 25px 20px;
            position: relative;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            margin-bottom: 45px; 
        }

        /* LEMA DENTRO DE LA FOTO EN LA PARTE INFERIOR */
        .profile-bio-inside {
            font-size: 16px;
            color: #ffffff;
            font-weight: 300;
            letter-spacing: 0.5px;
            text-shadow: 0px 1px 6px rgba(0,0,0,0.9);
            z-index: 2;
        }

        /* BOTÓN DE ENTRADA CON ILUMINACIÓN NEÓN PÚRPURA Y BLANCA */
        .main-entrance-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 85%;
            height: 58px;
            border-radius: 20px;
            background: #000000;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 17px;
            letter-spacing: 0.5px;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            margin-bottom: 20px; 
            border: 2px solid #a862ea;
            box-shadow: 
                0 0 20px rgba(255, 255, 255, 0.45),
                0 0 16px rgba(160, 60, 255, 0.8);
        }

        .main-entrance-button:active {
            transform: scale(0.97);
            box-shadow: 
                0 0 12px rgba(255, 255, 255, 0.3),
                0 0 8px rgba(160, 60, 255, 0.5);
        }
    </style>
</head>
<body>

    <!-- Capas de luces de fondo -->
    <div class="stars"></div>
    <div class="bg-glow glow-purple-1"></div>
    <div class="bg-glow glow-purple-2"></div>

    <div class="container">
        
        <!-- Título principal -->
        <h1 class="page-title">Anastasia Beyond</h1>

        <!-- Rayo de luz centrado en medio del título y la foto -->
        <div class="beam"></div>

        <!-- Foto principal -->
        <div class="header-banner">
            <div class="profile-bio-inside">Beyond imagination</div>
        </div>

        <!-- Botón de acceso -->
        <a href="aboutme.html" class="main-entrance-button">
            My Links
        </a>

    </div>

</body>
</html>
