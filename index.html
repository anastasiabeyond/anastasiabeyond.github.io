<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anastasia Beyond | Official Site</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .header-banner {
            width: 100%;
            height: 420px; /* Un poco más alta para darle protagonismo exclusivo */
            background-image: url('anastasia_main.jpeg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 35px 20px;
            position: relative;
            border-radius: 20px;
            margin-bottom: 40px; /* Espacio elegante antes del botón */
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .profile-name {
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
            text-shadow: 0px 2px 10px rgba(0,0,0,0.9);
            z-index: 2;
        }

        .profile-bio-inside {
            font-size: 16px;
            color: #ffffff;
            font-weight: 300;
            letter-spacing: 0.5px;
            text-shadow: 0px 1px 6px rgba(0,0,0,0.9);
            z-index: 2;
        }

        /* BOTÓN DE ENTRADA PREMIUM CON ILUMINACIÓN BLANCA */
        .main-entrance-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 85%;
            height: 58px;
            border-radius: 20px;
            background: #000000;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 17px;
            letter-spacing: 0.5px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4); 
        }

        .main-entrance-button:active {
            transform: scale(0.97);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Tarjeta Principal con tu foto, nombre y frase interna -->
        <div class="header-banner">
            <h1 class="profile-name">Anastasia Beyond</h1>
            <div class="profile-bio-inside">Beyond imagination</div>
        </div>

        <!-- Enlace hacia la subcarpeta /links -->
        <a href="links.html" class="main-entrance-button">
            My Links
        </a>

    </div>

</body>
</html>
